AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  ScopeGuard - audits a construction project's Box records for approved or recorded work missing from billing,
  keeps invoice balances, payments and retainage separate, and prepares an evidence-backed supplemental invoice
  draft for customer sign-off (docs/api-contract-v2.md).

Parameters:
  BoxFolderId:
    Type: String
    Description: Box folder ID of the project folder to scan (the number at the end of the Box folder URL).
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
    Description: Bedrock cross-region inference profile ID used with the Converse API.
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: CORS allowed origin for the HTTP API (e.g. https://main.xxxxxx.amplifyapp.com).

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    CodeUri: backend/
    Environment:
      Variables:
        DATA_BUCKET: !Ref DataBucket
        BOX_SECRET_ARN: !Ref BoxSecret
        BOX_SECRET_ID: !Ref BoxSecret
        BOX_FOLDER_ID: !Ref BoxFolderId
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        STORE: s3
        BOX_MODE: box
        LLM_MODE: bedrock

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          # Generated invoice PDFs are temporary in S3 (tagged on upload); Box keeps the saved copy [INV-09].
          - Id: ExpireTemporaryGeneratedPdfs
            Status: Enabled
            ExpirationInDays: 1
            TagFilters:
              - Key: scopeguard-temporary
                Value: "true"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  BoxSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: scopeguard/box/ccg
      Description: Box Client Credentials Grant app credentials for ScopeGuard. Replace the placeholder values after the first deploy.
      SecretString: '{"BOX_ENTERPRISE_ID":"REPLACE","BOX_CLIENT_ID":"REPLACE","BOX_CLIENT_SECRET":"REPLACE"}'

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: ScopeGuard scan worker (Box -> text -> Bedrock -> verification -> S3 JSON)
      Handler: worker_handler.handler
      Timeout: 900
      MemorySize: 2048
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref BoxSecret
        - Statement:
            - Sid: BedrockInvoke
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: ScopeGuard HTTP API (projects, records, audits, reviews, invoice drafts and generations)
      Handler: api_handler.handler
      Timeout: 29
      MemorySize: 1024
      Environment:
        Variables:
          WORKER_FUNCTION_NAME: !Ref WorkerFunction
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Sid: TagTemporaryGeneratedPdfs
              Effect: Allow
              Action:
                - s3:PutObjectTagging
              Resource: !Sub ${DataBucket.Arn}/*
        - LambdaInvokePolicy:
            FunctionName: !Ref WorkerFunction
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref BoxSecret
      Events:
        ListProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /projects
        GetProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /projects/{project_id}
        ListRecords:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /projects/{project_id}/records
        UploadRecord:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /projects/{project_id}/records
        GetRecordContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /projects/{project_id}/records/{file_id}/content
        GetRecordPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /projects/{project_id}/records/{file_id}/pages/{page}
        CreateScan:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /scans
        ListScans:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /scans
        GetScan:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /scans/{scan_id}
        PatchFinding:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /findings/{finding_id}
        GetInvoiceDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /projects/{project_id}/invoice-draft
        PatchInvoiceDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /projects/{project_id}/invoice-draft
        CreateInvoiceGeneration:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /projects/{project_id}/invoice-generations
        GetInvoiceGeneration:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /projects/{project_id}/invoice-generations/{generation_id}
        GetInvoiceGenerationContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /projects/{project_id}/invoice-generations/{generation_id}/content
        SaveInvoiceGenerationToBox:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /projects/{project_id}/invoice-generations/{generation_id}/save-to-box
        CreatePacket:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /packets

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowHeaders:
          - content-type
        ExposeHeaders:
          - content-disposition
        MaxAge: 600

Outputs:
  ApiUrl:
    Description: Base URL for NEXT_PUBLIC_API_URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  DataBucketName:
    Value: !Ref DataBucket
  BoxSecretArn:
    Description: Put the real Box CCG credentials here (aws secretsmanager put-secret-value)
    Value: !Ref BoxSecret
  WorkerFunctionName:
    Value: !Ref WorkerFunction
